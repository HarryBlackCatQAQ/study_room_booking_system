# keep nginx worker scaling automatic for the local docker host
worker_processes auto;

# keep the nginx pid file in the default alpine location
pid /var/run/nginx.pid;

events {
    # keep a practical worker connection limit for the local load balancer stack
    worker_connections 1024;
}

http {
    # keep the default mime type mappings available for frontend assets
    include /etc/nginx/mime.types;

    # keep unknown file types on a safe generic content type
    default_type application/octet-stream;

    # keep structured access logs for request verification
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr upstream_status=$upstream_status';

    # keep access logs enabled for the load balancer container
    access_log /var/log/nginx/access.log main;

    # keep error logs enabled at a practical verbosity level
    error_log /var/log/nginx/error.log warn;

    # keep sendfile enabled for efficient static asset delivery
    sendfile on;

    # keep tcp_nopush enabled for better packet batching on static files
    tcp_nopush on;

    # keep tcp_nodelay enabled for responsive proxied traffic
    tcp_nodelay on;

    # keep idle keepalive connections open long enough for normal browser reuse
    keepalive_timeout 65;

    # keep client uploads reasonably large for booking screenshots or similar payloads
    client_max_body_size 20m;

    # keep websocket upgrade handling centralized for proxy locations
    map $http_upgrade $connection_upgrade {
        # keep websocket upgrade requests upgraded
        default upgrade;
        # keep normal http requests on a regular connection close flow
        '' close;
    }

    # preserve the outer proxy scheme when this nginx sits behind a host-level tls terminator
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        # keep the already forwarded scheme when an outer reverse proxy provides it
        default $http_x_forwarded_proto;
        # fall back to the current nginx request scheme when no outer proxy is present
        '' $scheme;
    }

    # keep the rendered site configuration loaded from the nginx template directory
    include /etc/nginx/conf.d/*.conf;
}
