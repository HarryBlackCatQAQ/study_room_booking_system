# shared django backend settings
x-backend-common: &backend-common
  # backend image
  build:
    context: ../../..
    dockerfile: docker_file/nginx/load_balancer/backend.Dockerfile
  # backend env file
  env_file:
    - .env
  environment:
    PYTHONUNBUFFERED: "1"
  # collected static files
  volumes:
    - backend_static_data:/app/staticfiles
  # app, db, and redis networks
  networks:
    - studyroom_lb_net
    - postgres_cluster_net
    - redis_cluster_net
  # allow host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # java service
  java-recommendation-service:
    build:
      context: ../../..
      dockerfile: docker_file/nginx/load_balancer/java-recommendation.Dockerfile
    container_name: studyroom_java_recommendation_service
    restart: unless-stopped
    networks:
      - studyroom_lb_net
    expose:
      - "5101"

  # go service
  go-availability-service:
    build:
      context: ../../..
      dockerfile: docker_file/nginx/load_balancer/go-availability.Dockerfile
    container_name: studyroom_go_availability_service
    restart: unless-stopped
    networks:
      - studyroom_lb_net
    expose:
      - "5102"

  # one-time django init
  backend-init:
    <<: *backend-common
    container_name: studyroom_backend_init
    restart: "no"
    depends_on:
      - java-recommendation-service
      - go-availability-service
    command: ["/bin/sh", "/opt/studyroom/scripts/run-init.sh"]

  # django backend 1
  backend-app-1:
    <<: *backend-common
    container_name: studyroom_backend_app_1
    restart: unless-stopped
    depends_on:
      backend-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "/opt/studyroom/scripts/start-backend.sh"]
    expose:
      - "${BACKEND_APP_PORT}"
    # backend health check
    healthcheck:
      test: ["CMD", "python", "/opt/studyroom/scripts/http_healthcheck.py", "127.0.0.1", "${BACKEND_APP_PORT}", "/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10

  # django backend 2
  backend-app-2:
    <<: *backend-common
    container_name: studyroom_backend_app_2
    restart: unless-stopped
    depends_on:
      backend-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "/opt/studyroom/scripts/start-backend.sh"]
    expose:
      - "${BACKEND_APP_PORT}"
    # backend health check
    healthcheck:
      test: ["CMD", "python", "/opt/studyroom/scripts/http_healthcheck.py", "127.0.0.1", "${BACKEND_APP_PORT}", "/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10

  # django backend 3
  backend-app-3:
    <<: *backend-common
    container_name: studyroom_backend_app_3
    restart: unless-stopped
    depends_on:
      backend-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "/opt/studyroom/scripts/start-backend.sh"]
    expose:
      - "${BACKEND_APP_PORT}"
    # backend health check
    healthcheck:
      test: ["CMD", "python", "/opt/studyroom/scripts/http_healthcheck.py", "127.0.0.1", "${BACKEND_APP_PORT}", "/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10

  # nginx load balancer
  nginx-load-balancer:
    build:
      context: ../../..
      dockerfile: docker_file/nginx/load_balancer/nginx.Dockerfile
    container_name: studyroom_nginx_load_balancer
    restart: unless-stopped
    env_file:
      - .env
    # wait for all backends
    depends_on:
      backend-app-1:
        condition: service_healthy
      backend-app-2:
        condition: service_healthy
      backend-app-3:
        condition: service_healthy
    ports:
      - "${NGINX_PUBLIC_PORT}:80"
    # django static files
    volumes:
      - backend_static_data:/var/www/backend-static:ro
    networks:
      - studyroom_lb_net
    # nginx health check
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  # django static files
  backend_static_data:

networks:
  # internal app network
  studyroom_lb_net:
    name: studyroom_lb_net
  # postgres cluster network
  postgres_cluster_net:
    external: true
    name: cluster_default
  # redis cluster network
  redis_cluster_net:
    external: true
    name: cluster_redis_cluster_net
