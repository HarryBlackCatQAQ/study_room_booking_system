# listen on all interfaces inside the docker network
bind 0.0.0.0

# docker handles network isolation for this stack
protected-mode no

# enable redis cluster mode
cluster-enabled yes

# prefer announced hostnames so host-based local development can remap them safely
cluster-preferred-endpoint-type hostname

# keep the cluster node metadata in the default file
cluster-config-file nodes.conf

# keep failover detection reasonably fast
cluster-node-timeout 5000

# keep append-only persistence enabled
appendonly yes

# keep snapshot saves disabled for this demo-oriented cluster
save ""

# keep the data directory explicit
dir /data
