# listen on all network interfaces inside the container
bind 0.0.0.0
# disable protected mode because docker networking is already controlled
protected-mode no
# use the default redis port
port 6379
# store runtime files inside the mounted data folder
dir /data

# disable snapshot saves for this simple cache setup
save ""
# disable append-only persistence for this simple cache setup
appendonly no

# limit the cache size inside the container
maxmemory 256mb
# evict least recently used keys when memory is full
maxmemory-policy allkeys-lru
