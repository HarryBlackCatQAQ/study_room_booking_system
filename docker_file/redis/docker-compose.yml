services:
  # run one redis container for the simple local cache setup
  redis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyroom_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:5013:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # keep redis data after the container is recreated
  redis_data:
