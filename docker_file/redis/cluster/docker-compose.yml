services:
  # redis cluster node 1
  redis-cluster-node-1:
    image: redis:7.4-alpine
    container_name: studyroom_redis_cluster_node_1
    restart: unless-stopped
    env_file:
      - .env
    command:
      - redis-server
      - /usr/local/etc/redis/redis-cluster.conf
      - --port
      - "7001"
      - --cluster-announce-hostname
      - redis-cluster-node-1
      - --cluster-announce-port
      - "7001"
      - --cluster-announce-bus-port
      - "17001"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_CLUSTER_NODE_1_PORT}:7001"
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis-cluster.conf:ro
      - redis_cluster_node_1_data:/data
    networks:
      redis_cluster_net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

