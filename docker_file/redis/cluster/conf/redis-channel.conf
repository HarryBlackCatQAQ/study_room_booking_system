# listen on all network interfaces inside the container
bind 0.0.0.0
# disable protected mode because docker networking is already controlled
protected-mode no
# keep the pub/sub redis instance on the normal redis port
port 6379
# disable append-only persistence for the realtime channel server
appendonly no
# disable snapshot saves for the realtime channel server
save ""
# store runtime files inside the mounted data folder
dir /data
# limit the cache size inside the container
maxmemory 256mb
# evict least recently used keys when memory is full
maxmemory-policy allkeys-lru
