# listen on all interfaces
bind 0.0.0.0
# docker handles network isolation
protected-mode no
# enable cluster mode
cluster-enabled yes
# cluster node info file
cluster-config-file nodes.conf
# node timeout
cluster-node-timeout 5000
# keep append-only persistence
appendonly yes
# append-only file
appendfilename "appendonly.aof"
# disable snapshot saves
save ""
# data directory
dir /data
