# listen on all network interfaces inside the container
bind 0.0.0.0
# disable protected mode because docker networking is already controlled
protected-mode no
# turn on redis cluster mode for the sharded cache nodes
cluster-enabled yes
# store cluster membership data in this file
cluster-config-file nodes.conf
# set how quickly the cluster treats a node as unavailable
cluster-node-timeout 5000
# keep append-only persistence on for the cluster nodes
appendonly yes
# use the default append-only filename
appendfilename "appendonly.aof"
# disable snapshot saves because append-only persistence is used instead
save ""
# store runtime files inside the mounted data folder
dir /data
